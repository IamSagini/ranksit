<button class="heart{% if liked %} liked{% endif %}" id="like-{{ piece_id }}"
        hx-post="/piece/{{ piece_id }}/like" hx-target="#like-{{ piece_id }}" hx-swap="outerHTML" aria-label="Like">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="{{ 'currentColor' if liked else 'none' }}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
  </svg>
  <span>{{ count }}</span>
</button>
