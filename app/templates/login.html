{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <a href="/" class="auth-logo"><img src="/static/favicon.svg" alt="" width="34" height="34"><span class="auth-logo-name">rank<span class="brand-accent">sit</span></span></a>
  <p class="eyebrow">Welcome back</p>
  <h1>Log in</h1>
  {% if notice %}<div class="notice notice-ok">{{ notice }}</div>{% endif %}
  {% if error %}<div class="notice">{{ error }}</div>{% endif %}
  <a href="/auth/google" class="btn btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    Continue with Google
  </a>
  <div class="auth-divider"><span>or</span></div>
  <form method="post" action="/login" class="auth-form">
    <label class="field"><span>Email</span><input type="email" name="email" required autofocus></label>
    <label class="field"><span>Password</span><input type="password" name="password" required></label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="auth-alt">No account? <a href="/signup">Sign up</a></p>
</div>
{% endblock %}
